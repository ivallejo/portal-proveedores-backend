services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: web-proveedores-sqlserver
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: '${MSSQL_SA_PASSWORD}'
    ports:
      - '${MSSQL_PORT:-1433}:1433'
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: [ 'CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1' ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Emulador de Azure Blob Storage para los adjuntos (Storage:Provider=AzureBlob).
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: web-proveedores-azurite
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --skipApiVersionCheck
    ports:
      - '${AZURITE_BLOB_PORT:-10000}:10000'
    volumes:
      - azurite_data:/data

volumes:
  sqlserver_data:
  azurite_data:
